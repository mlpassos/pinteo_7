<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" preserveAspectRatio="none">
  <title>Veios de madeira procedural originais — estudo Pinte o 7</title>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".009 .23" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".35" intercept=".32"/>
      <feFuncG type="linear" slope=".25" intercept=".18"/>
      <feFuncB type="linear" slope=".15" intercept=".07"/>
      <feFuncA type="linear" slope=".3"/>
    </feComponentTransfer>
  </filter>
  <rect width="640" height="640" filter="url(#grain)"/>
</svg>
