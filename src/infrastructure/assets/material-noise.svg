<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <title>Microtextura procedural original — estudo Pinte o 7</title>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .15 0 0 0 0 .12 0 0 0 0 .08 0 0 0 .06 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
